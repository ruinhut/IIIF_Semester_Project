[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "iiif-provider-census"
version = "0.2.0"
description = "Module 1: census and deterministic selection of IIIF providers"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
iiif-provider-census = "iiif_provider_census.cli:main"

[tool.setuptools.packages.find]
include = ["iiif_provider_census*"]
