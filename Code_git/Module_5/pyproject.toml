[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "iiif-rights-filter"
version = "0.1.0"
description = "Extract, classify, and policy-filter rights evidence in IIIF Manifests"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
iiif-rights-filter = "iiif_rights_filter.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["iiif_rights_filter*"]
