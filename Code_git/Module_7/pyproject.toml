[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "iiif-common-exporter"
version = "0.2.0"
description = "Module 7: validate and export common IIIF data plus OCR-oriented profiles"
requires-python = ">=3.10"
dependencies = ["jsonschema>=4.19,<5"]

[project.scripts]
iiif-common-exporter = "iiif_common_exporter.cli:main"

[tool.setuptools.packages.find]
include = ["iiif_common_exporter*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
